<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima Sustentável Inteligente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #dff7e3, #dff2ff);
            min-height: 100vh;
            color: #123
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 24px
        }

        .center {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08)
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px
        }

        p {
            opacity: .8;
            line-height: 1.5
        }

        .btn {
            margin-top: 20px;
            border: none;
            background: #0a8f62;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: .2s
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #087a53
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 5px solid #d8e9e0;
            border-top-color: #0a8f62;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px
        }

        .mini {
            transition: .2s
        }

        .mini:hover {
            transform: translateY(-4px)
        }

        .title {
            font-size: .9rem;
            opacity: .7;
            margin-bottom: 8px
        }

        .value {
            font-size: 1.4rem;
            font-weight: 700
        }

        .section {
            margin-top: 22px
        }

        .list li {
            list-style: none;
            background: #f4fbf7;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .small {
            font-size: .95rem
        }

        @media(max-width:600px) {
            h1 {
                font-size: 1.8rem
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        const app = document.getElementById('app');
        const mockData = { city: 'Amambai', state: 'MS', temp: 31, feelsLike: 34, rain: false, humidity: 67, wind: 14, condition: 'Ensolarado', air: 'Moderada', aqi: 2 };
        function home() { app.innerHTML = `<div class='center'><div class='container'><div class='card'><h1>Clima Sustentável Inteligente</h1><p>Dados climáticos da sua região com recomendações ambientais em tempo real.</p><button class='btn' onclick='startApp()'>📍 Usar minha localização</button></div></div></div>` }
        function startApp() { loading(); setTimeout(() => { showDashboard(mockData) }, 2000) }
        function loading() { app.innerHTML = `<div class='center'><div class='container'><div class='card'><h1>Consultando dados</h1><div class='spinner'></div><p>Obtendo sua localização...<br>Consultando dados ambientais...</p></div></div></div>` }
        function recommendations(d) { const r = []; if (d.temp > 30) { r.push('💧 Hidrate-se bem durante o dia'); r.push('❄️ Reduza uso excessivo de ar-condicionado'); r.push('🪟 Priorize ventilação natural') } if (!d.rain) r.push('☀️ Aproveite iluminação natural'); if (d.wind > 10) r.push('🌬️ Aproveite circulação natural do ar'); if (d.air === 'Moderada') { r.push('🚶 Prefira caminhar em trajetos curtos'); r.push('🚍 Considere transporte coletivo') } return r }
        function showDashboard(d) { app.innerHTML = `<div class='container'><div class='topbar'><h1>Painel Climático</h1><button class='btn small' onclick='home()'>↩ Voltar</button></div><div class='grid'>${card('📍 Localização', d.city + ' - ' + d.state)}${card('🌡️ Temperatura', d.temp + '°C<br><span class=small>Sensação: ' + d.feelsLike + '°C</span>')}${card('☀️ Clima', d.condition + '<br><span class=small>' + (d.rain ? 'Com chuva' : 'Sem chuva') + '</span>')}${card('💧 Umidade', d.humidity + '%')}${card('🌬️ Vento', d.wind + ' km/h')}${card('🌿 Qualidade do ar', d.air + '<br><span class=small>AQI: ' + d.aqi + '</span>')}</div><div class='section card'><h2 style='margin-bottom:14px'>Recomendações Sustentáveis</h2><ul class='list'>${recommendations(d).map(i => '<li>' + i + '</li>').join('')}</ul></div></div>` }
        function card(t, v) { return `<div class='card mini'><div class='title'>${t}</div><div class='value'>${v}</div></div>` }
        home();
    </script>
</body>

</html>
